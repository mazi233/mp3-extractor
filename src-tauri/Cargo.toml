[package]
name = "mp3-extractor"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "rustls-tls", "json"], default-features = false }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
ffmpeg-sidecar = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "mp3_extractor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
